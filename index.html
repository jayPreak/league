<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rift Clash</title>
    <meta name="description" content="A 3v3 browser MOBA modeled on classic lane-pushing mechanics." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div id="topbar">
        <span class="blue" id="killsB">0</span>
        <span id="clock">00:00</span>
        <span class="red" id="killsR">0</span>
      </div>
      <div id="scoreline"></div>
      <div id="feed"></div>
      <div id="respawn" class="hidden"></div>
      <div id="recallbar" class="hidden"><div id="recallfill"></div><span>Recalling</span></div>

      <div id="bottom">
        <div id="portrait"><span id="pinit"></span><div id="plevel">1</div></div>
        <div id="center">
          <div id="abilities"></div>
          <div class="bar hp"><div id="hpfill"></div><span id="hptext"></span></div>
          <div class="bar xp"><div id="xpfill"></div></div>
        </div>
        <div id="stats"></div>
        <div id="invwrap">
          <div id="inv"></div>
          <button id="shopbtn">Shop (P) · <span id="gold">0</span>g</button>
        </div>
      </div>
      <canvas id="minimap" width="220" height="220"></canvas>
    </div>

    <div id="shop" class="hidden">
      <div class="shophead">
        <h2>Armory</h2>
        <span id="shopgold"></span>
        <button id="shopclose">✕</button>
      </div>
      <p id="shopnote"></p>
      <div id="shopgrid"></div>
    </div>

    <div id="menu">
      <h1>RIFT CLASH</h1>
      <p class="tag">3v3 lane battle. Destroy the enemy Nexus.</p>
      <div id="champs"></div>
      <div id="diff"></div>
      <button id="play" disabled>Pick a champion</button>
      <div class="controls">
        <div><b>Right / Left click</b> move &amp; attack (hold to keep moving)</div>
        <div><b>Q W E R</b> abilities at cursor (R unlocks at level 6)</div>
        <div><b>D</b> Flash · <b>F</b> Heal · <b>B</b> Recall · <b>S</b> Stop</div>
        <div><b>P</b> Shop (in fountain) · <b>Y</b> camera lock · <b>Space</b> center · <b>wheel</b> zoom</div>
      </div>
    </div>

    <div id="end" class="hidden">
      <h1 id="endtitle"></h1>
      <div id="endstats"></div>
      <button id="again">Play again</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
